
name: PayLink CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Verify Java Version
        run: java -version

      - name: Build and Run Tests
        run: ./mvnw -B clean verify
